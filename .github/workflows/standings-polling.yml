name: Standings polling
on:
  pull_request:
  push:
    branches: [main]
jobs:
  standings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx vitest run convex/lib/standingsPolling.test.ts convex/import/standingsWrite.test.ts convex/import/sportlinkStandingsFetch.test.ts convex/import/sportlinkStandingsMapper.test.ts convex/standings.test.ts
      - run: node --test scripts/standings-release-bundle.test.mjs
